{% load static %}

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="{% static 'css/account/form_combined.css' %}">
        <title>{% block page_title %} Password Reset {% endblock %}</title>
    </head>
    <body>

        <h2>Set new password</h2>

        {% if token_fail %}
            <p>The password reset link is invalid or has expired.</p>
        {% else %}
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Change password</button>
            </form>
        {% endif %}

    </body>
</html>
